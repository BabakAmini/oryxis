[package]
name = "oryxis-telnet"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# Per-host terminal encoding: transcode session bytes <-> UTF-8 for
# non-UTF-8 charsets, mirroring the SSH engine's PTY transcoding.
encoding_rs = "0.8"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
