[package]
name = "oryxis-telnet"
version = "0.1.0"
edition = "2024"

[dependencies]
# Shared model types (AddressFamily) + net helpers (IPv6 bracketing,
# family filter), so the per-host IP-version preference behaves
# identically to the SSH engine's.
oryxis-core = { path = "../oryxis-core" }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# Per-host terminal encoding: transcode session bytes <-> UTF-8 for
# non-UTF-8 charsets, mirroring the SSH engine's PTY transcoding.
encoding_rs = "0.8"
# Telnet over TLS (`telnets`, port 992): the handshake runs before any
# option negotiation, so the NVT rides inside the tunnel unchanged.
rustls = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
