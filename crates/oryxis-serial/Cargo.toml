[package]
name = "oryxis-serial"
version = "0.1.0"
edition = "2024"

[dependencies]
oryxis-core = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# Async serial I/O. default-features = false drops the libudev build
# dependency (port ENUMERATION on Linux), which the CI images don't
# carry (no libudev-dev). Opening a port by path still works fully;
# Oryxis takes the path as free text (Connection.hostname), so
# enumeration is not needed.
tokio-serial = { version = "5", default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
# Real PTY pair for the interop test (a genuine OS tty, not an
# in-memory duplex). Unix-only; the test is cfg(unix)-gated.
[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.29", features = ["term", "fs"] }
