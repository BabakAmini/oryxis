[package]
name = "oryxis-core"
version = "0.1.0"
edition = "2024"

[dependencies]
# Home-dir resolution for the well-known agent socket path
# (`agent_paths`); tiny, already in the workspace tree via oryxis-app.
dirs = "6"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
# RFC 6238 TOTP generation (`totp` module): HMAC-SHA1/256/512 and the
# Base32 secret decoding. data-encoding is already in the tree via ring.
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
data-encoding = "2"
# Optional regex patterns in login scripts (`login_script` module); the
# suffix form needs no engine, the escape hatch does.
regex = { workspace = true }

# Free-space probe (`disk` module). `statvfs` on unix and
# `GetDiskFreeSpaceExW` on Windows: no crate wraps both without pulling
# a system-info stack we would use one function of.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# 0.61 is the line the rest of the tree resolves, so the build keeps one
# `windows-sys` (it numbers independently from `windows`).
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
