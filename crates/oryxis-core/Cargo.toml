[package]
name = "oryxis-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
# RFC 6238 TOTP generation (`totp` module): HMAC-SHA1/256/512 and the
# Base32 secret decoding. data-encoding is already in the tree via ring.
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
data-encoding = "2"
