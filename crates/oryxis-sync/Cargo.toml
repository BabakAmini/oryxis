[package]
name = "oryxis-sync"
version = "0.1.0"
edition = "2021"

[dependencies]
oryxis-core = { workspace = true }
oryxis-vault = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
mdns-sd = { workspace = true }
x25519-dalek = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = "0.4"
bincode = { workspace = true }
hex = { workspace = true }
chacha20poly1305 = { workspace = true }
sha2 = "0.11"
hkdf = "0.13"
subtle = "2"
# No-provider webpki roots: `rustls-tls` expands to `__rustls-ring` and would
# put a second crypto backend back in the tree. The provider is installed at
# process start (`engine::start`, and `main` in the app).
reqwest = { version = "0.12", features = ["json", "rustls-tls-webpki-roots-no-provider"], default-features = false }

[dev-dependencies]
tempfile = "3"
