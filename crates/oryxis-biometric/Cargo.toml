[package]
name = "oryxis-biometric"
version = "0.1.0"
edition = "2024"

# Local app-unlock via the OS biometric / keystore. This is NOT SSH auth:
# it gates release of the vault master password from an OS-protected store
# behind a platform user-presence check (Windows Hello, macOS Touch ID, or
# the Linux login keyring). See `lib.rs` for the security model.
[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }

# Linux (and other unixes that aren't macOS): the login keyring via the
# freedesktop Secret Service. No fingerprint API is standard on Linux, so
# this is "OS keystore gated by the login session", not real biometry; the
# app surfaces that honestly. `sync-secret-service` is the blocking zbus
# backend (no async runtime needed) and `crypto-rust` keeps the transport
# encryption pure-Rust (no system libgcrypt/libdbus C deps).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

# Windows: Windows Hello (UserConsentVerifier) for the presence prompt +
# Credential Manager (per-user, DPAPI-backed) for the secret at rest.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_Security_Credentials",
] }
# windows-future 0.3 dropped the blocking `IAsyncOperation::get()`; the
# WinRT ops are `IntoFuture` now, so we drive them to completion on the
# calling (background) thread with a minimal blocking executor.
pollster = "0.4"

# macOS: Keychain item guarded by a SecAccessControl user-presence flag,
# so reading it intrinsically raises the Touch ID / passcode prompt. The
# Security-framework functions are declared as externs against the stable
# C ABI directly (in `macos.rs`), so we only need Core Foundation for the
# CFString / CFData / CFDictionary plumbing.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"

[dev-dependencies]
# Exercises the orchestrator against the in-memory mock provider.
