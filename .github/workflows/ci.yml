name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  ORYXIS_SIGNALING_URL: ${{ secrets.ORYXIS_SIGNALING_URL }}
  ORYXIS_SIGNALING_TOKEN: ${{ secrets.ORYXIS_SIGNALING_TOKEN }}

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev libwayland-dev libxkbcommon-dev \
            lrzsz

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # --locked makes the committed Cargo.lock authoritative. Two crates
      # can carry ranges wide enough to land on DIFFERENT majors of the
      # same dependency and still both resolve (gpu-allocator asks for
      # `windows = ">=0.53, <=0.62"` while wgpu-hal pins 0.62 and passes
      # D3D12 types across the boundary), so a silent re-resolve breaks a
      # build nobody touched, on one platform only. Failing here beats
      # discovering it in a nightly.
      - name: Check
        run: cargo check --locked --all-targets

      - name: Test
        run: cargo test --locked --workspace

      - name: Clippy
        run: cargo clippy --locked --workspace -- -D warnings
