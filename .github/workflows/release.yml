name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger for testing the build/package steps (e.g. the macOS
  # .dmg) without cutting a release. The publishing jobs below are gated
  # on a tag ref, so a manual run only produces downloadable artifacts.
  workflow_dispatch:

permissions:
  contents: write
  # The SignPath action reads workflow run/job details and the uploaded
  # artifact via the Actions REST API. Listing `permissions` explicitly zeroes
  # every unlisted scope, so `actions: read` must be granted or signing 403s.
  actions: read

env:
  CARGO_TERM_COLOR: always
  ORYXIS_SIGNALING_URL: ${{ secrets.ORYXIS_SIGNALING_URL }}
  ORYXIS_SIGNALING_TOKEN: ${{ secrets.ORYXIS_SIGNALING_TOKEN }}

jobs:
  build-windows-x86:
    name: Windows x86_64
    runs-on: windows-latest
    # SignPath Authenticode signing config. The token lives in a secret; the
    # rest are repo Variables so forks / manual runs without the secret just
    # skip signing (see the `if: env.SIGNPATH_API_TOKEN != ''` guards below).
    # While validating, point SIGNPATH_SIGNING_POLICY_SLUG at `test-signing`
    # (self-signed test cert); flip it to `release-signing` once SignPath
    # imports the production certificate.
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || 'oryxis' }}
      SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
      SIGNPATH_ARTIFACT_CONFIG_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG || 'exe' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: windows-release-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --locked --release

      # --- Authenticode-sign oryxis.exe via SignPath, BEFORE it is packaged
      # into the zip or wrapped by the NSIS installers, so the signature rides
      # into every downstream artifact. Skipped when SIGNPATH_API_TOKEN is
      # absent (forks / manual dispatch); when present, a SignPath error fails
      # the build rather than shipping unsigned.
      - name: Stage unsigned exe for SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path signpath\exe-in | Out-Null
          Copy-Item target\release\oryxis.exe signpath\exe-in\oryxis.exe -Force
      - name: Upload unsigned exe
        if: env.SIGNPATH_API_TOKEN != ''
        id: upload-unsigned-exe
        uses: actions/upload-artifact@v7
        with:
          name: signpath-unsigned-exe-x86_64
          path: signpath\exe-in\oryxis.exe
          retention-days: 1
      - name: SignPath sign exe
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signpath\exe-out
      - name: Replace exe with signed copy
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: Copy-Item signpath\exe-out\oryxis.exe target\release\oryxis.exe -Force

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target\release\oryxis.exe dist\
          Copy-Item README.md dist\
          Copy-Item resources\logo_64.png dist\
          Compress-Archive -Path dist\* -DestinationPath oryxis-windows-x86_64.zip
      - name: Install NSIS + EnVar plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # choco community repo occasionally returns 503s — retry a few times.
          $max = 5
          $ok = $false
          for ($i = 1; $i -le $max -and -not $ok; $i++) {
            Write-Host "NSIS install attempt $i/$max"
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -eq 0) { $ok = $true }
            elseif ($i -lt $max) { Start-Sleep -Seconds 20 }
          }
          if (-not $ok) { throw "choco install nsis failed after $max attempts" }
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            throw 'makensis.exe not found after install'
          }
          Add-Content $env:GITHUB_PATH 'C:\Program Files (x86)\NSIS'

          # EnVar plugin — adds PATH manipulation primitives to NSIS
          # (AddValue/DeleteValue with dedup + WM_SETTINGCHANGE
          # broadcast). The NSIS wiki itself recommends EnVar over
          # raw WriteRegExpandStr, which truncates at NSIS_MAX_STRLEN
          # (1024 chars). Pinned to v0.3.1 from the GitHub mirror at
          # GsNSIS/EnVar.
          $envarZip = "$env:RUNNER_TEMP\EnVar.zip"
          $envarDir = "$env:RUNNER_TEMP\EnVar"
          Invoke-WebRequest `
            -Uri 'https://github.com/GsNSIS/EnVar/releases/download/v0.3.1/EnVar-Plugin.zip' `
            -OutFile $envarZip
          Expand-Archive -Path $envarZip -DestinationPath $envarDir -Force
          # The choco nsis package doesn't pre-create the per-arch
          # plugin subdirs, so make sure they exist before copying.
          New-Item -ItemType Directory -Force -Path 'C:\Program Files (x86)\NSIS\Plugins\amd64-unicode' | Out-Null
          New-Item -ItemType Directory -Force -Path 'C:\Program Files (x86)\NSIS\Plugins\x86-unicode' | Out-Null
          Copy-Item "$envarDir\Plugins\amd64-unicode\EnVar.dll" 'C:\Program Files (x86)\NSIS\Plugins\amd64-unicode\' -Force
          Copy-Item "$envarDir\Plugins\x86-unicode\EnVar.dll" 'C:\Program Files (x86)\NSIS\Plugins\x86-unicode\' -Force
      - name: Build installers
        shell: pwsh
        run: |
          # On a tag (v0.8.3) DisplayVersion is the plain SemVer winget
          # compares against its manifest. A manual workflow_dispatch run has
          # no tag, so fall back to 0.0.0 (NSIS VIProductVersion must be
          # X.X.X.X) to exercise the build/sign path.
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref_name }}".TrimStart('v')
          } else {
            $version = "0.0.0"
          }
          cd resources
          # System installer (UAC, %ProgramFiles%) — winget targets this one.
          makensis "/DVERSION=$version" "/DARCH=x86_64" "/DBINPATH=..\target\release" installer.nsi
          # Per-user installer (no UAC, %LOCALAPPDATA%) — auto-updater
          # picks this when the running exe lives under LOCALAPPDATA.
          makensis "/DVERSION=$version" "/DARCH=x86_64" "/DBINPATH=..\target\release" installer-user.nsi

      # --- Authenticode-sign the two NSIS installers via SignPath. Each is a
      # PE file; signed as its own request so the downloaded artifact maps
      # back unambiguously. NSIS writes both to the repo root (OutFile
      # "..\oryxis-*-setup-${ARCH}.exe").
      - name: Stage unsigned installers for SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path signpath\sys-in,signpath\usr-in | Out-Null
          Copy-Item oryxis-setup-x86_64.exe signpath\sys-in\ -Force
          Copy-Item oryxis-user-setup-x86_64.exe signpath\usr-in\ -Force
      - name: Upload unsigned system installer
        if: env.SIGNPATH_API_TOKEN != ''
        id: upload-unsigned-sys
        uses: actions/upload-artifact@v7
        with:
          name: signpath-unsigned-sys-x86_64
          path: signpath\sys-in\oryxis-setup-x86_64.exe
          retention-days: 1
      - name: SignPath sign system installer
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-sys.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signpath\sys-out
      - name: Upload unsigned user installer
        if: env.SIGNPATH_API_TOKEN != ''
        id: upload-unsigned-usr
        uses: actions/upload-artifact@v7
        with:
          name: signpath-unsigned-usr-x86_64
          path: signpath\usr-in\oryxis-user-setup-x86_64.exe
          retention-days: 1
      - name: SignPath sign user installer
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-usr.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signpath\usr-out
      - name: Replace installers with signed copies
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          Copy-Item signpath\sys-out\oryxis-setup-x86_64.exe oryxis-setup-x86_64.exe -Force
          Copy-Item signpath\usr-out\oryxis-user-setup-x86_64.exe oryxis-user-setup-x86_64.exe -Force

      - uses: actions/upload-artifact@v7
        with:
          name: oryxis-windows-x86_64
          path: |
            oryxis-windows-x86_64.zip
            oryxis-setup-x86_64.exe
            oryxis-user-setup-x86_64.exe

  release:
    name: Create Release
    needs: [build-windows-x86]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: oryxis-windows-x86_64

      # Detached Ed25519 signature per asset (`<asset>.sig`, base64).
      # The auto-updater verifies the downloaded artifact against the
      # baked-in PROD_PUBKEY before launching it, so every published
      # asset must carry its signature.
      - uses: dtolnay/rust-toolchain@stable
      - name: Sign release assets
        env:
          ORYXIS_SIGNING_KEY: ${{ secrets.ORYXIS_SIGNING_KEY }}
        run: |
          set -euo pipefail
          cargo build --locked --release -p oryxis-plugin-signer
          for f in oryxis-*; do
            case "$f" in *.sig) continue ;; esac
            ./target/release/oryxis-plugin-signer sign "$f" > "$f.signinfo"
            grep '^signature_b64' "$f.signinfo" | awk '{print $3}' > "$f.sig"
            rm "$f.signinfo"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            oryxis-windows-x86_64.zip
            oryxis-setup-x86_64.exe
            oryxis-user-setup-x86_64.exe
            oryxis-*.sig

