name: Community themes

# The contributed-theme directory (issue #118). A submission is one JSON
# file added through GitHub's web editor; `themes/index.json` is what the
# gallery page fetches, and it is regenerated here so a contributor never
# has to run anything locally. That is the whole reason this is a
# separate workflow from CI: it needs write access, and CI does not.

on:
  push:
    branches: [main]
    paths:
      - "themes/**"
      - "scripts/gen_theme_index.py"
  pull_request:
    paths:
      - "themes/**"
      - "scripts/gen_theme_index.py"
  # Manual recovery: if a push run loses the head race (see the
  # expectedHeadOid note below) this regenerates from the current head.
  workflow_dispatch:

# Least privilege by default; only the job that commits the regenerated
# index widens it. Declared here rather than left implicit because a
# theme pull request comes from a fork we do not control, and the default
# token grant is broader than reading one directory needs.
permissions:
  contents: read

jobs:
  validate:
    name: Validate submissions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # Deliberately NOT `--check`: a pull request is expected to leave
      # the index stale (main regenerates it on merge). What has to fail
      # here is a file that would not import, so this runs the generator
      # for its validation and ignores what it writes.
      - name: Validate every theme file
        run: python3 scripts/gen_theme_index.py

  index:
    name: Regenerate index
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The push happens over the THEMES_DEPLOY_KEY deploy key, not the
      # workflow token: the main ruleset (PR required, restricted
      # updates, verified signatures) rejects a push from the Actions
      # bot, and a personal-account repository cannot list the Actions
      # app as a ruleset bypass actor. "Deploy keys" is a bypass actor
      # instead, and this write-scoped key exists solely for this
      # workflow. A stale-head push still fails on non-fast-forward and
      # the newer push's own run (or a manual dispatch) regenerates.
      - uses: actions/checkout@v5
        with:
          ssh-key: ${{ secrets.THEMES_DEPLOY_KEY }}

      - name: Regenerate themes/index.json
        run: python3 scripts/gen_theme_index.py

      - name: Commit if it changed
        run: |
          if git diff --quiet -- themes/index.json; then
            echo "index already current"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/index.json
          git commit -m "chore(themes): regenerate index"
          git push
